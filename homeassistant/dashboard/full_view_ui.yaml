type: sections
max_columns: 3
title: 3D printer
path: 3d-printer
icon: mdi:printer-3d-nozzle
sections:
  - type: grid
    cards:
      - type: iframe
        url: http://192.168.15.11/ha
        grid_options:
          columns: full
          rows: 12
  - type: grid
    cards:
      - type: custom:marlin-move-control-card
        device_id: IoT_7
        accumulate_delay: 1500
        max_accumulate_limit: 60
        temp_presets:
          - h: 215
            b: 60
          - h: 230
            b: 75
          - h: 240
            b: 100
          - h: 240
            b: 0
          - h: 0
            b: 70
        macro_buttons:
          - name: Steppers Off
            gcode: M84
            mode: pulse
          - name: Fan 100%
            gcode: M106 S255
            mode: loop
          - name: Fan Off
            gcode: M107
            mode: pulse
          - name: Extrude 10μμ
            gcode: |
              G91
              G1 E10 F100
              G90
            mode: loop
          - name: All OFF
            gcode: |
              M104 S0
              M140 S0
              M107
            mode: pulse
  - type: grid
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            entities:
              - entity: text.iot_7_g
                name: Bridge state
              - entity: sensor.iot_7_tb_str
                name: 't : bed'
              - entity: sensor.iot_7_th_str
                name: 't : hotend'
              - entity: sensor.iot_7_p
                name: Progress
              - entity: sensor.iot_7_rssi
                name: WiFi Rx level
              - entity: number.iot_7_u
                name: Uptime
                type: attribute
                attribute: Uptime
            grid_options:
              rows: auto
              columns: 9
          - type: horizontal-stack
            cards:
              - show_name: true
                show_icon: false
                type: button
                tap_action:
                  action: none
                hold_action:
                  action: perform-action
                  target: {}
                  perform_action: mqtt.publish
                  data:
                    topic: marlin_bridge/IoT_7_U/cmd
                    payload: '3'
                name: DIMENSIONS
              - show_name: true
                show_icon: false
                type: button
                tap_action:
                  action: none
                hold_action:
                  action: perform-action
                  target: {}
                  perform_action: mqtt.publish
                  data:
                    topic: marlin_bridge/IoT_7_U/cmd
                    payload: '1'
                name: DISCOVERY
              - show_name: true
                show_icon: false
                type: button
                tap_action:
                  action: none
                hold_action:
                  action: perform-action
                  target: {}
                  perform_action: mqtt.publish
                  data:
                    topic: marlin_bridge/IoT_7_U/cmd
                    payload: '0'
                name: RESTART
            grid_options:
              columns: 9
              rows: auto
          - show_name: true
            show_icon: false
            type: button
            tap_action:
              action: none
            hold_action:
              action: perform-action
              target: {}
              perform_action: mqtt.publish
              data:
                topic: marlin_bridge/IoT_7_U/cmd
                payload: '2'
            name: EMERGENCY STOP
        grid_options:
          columns: 9
          rows: auto
